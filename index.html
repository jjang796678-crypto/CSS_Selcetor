<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 선택자</title>
    <!-- link = CSS 파일 연결  -->
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- 태그 선택자  -->
    <h1>css 선택자</h1>
    <p>P태그 색상 변경</p>
    <p>P태그 글자 사이즈 변경</p>
    <!-- 클래스 선택자  -->
    <h2 class="menu1">김치찌개</h2>
    <h2 class="menu2">된장찌개</h2>
    <h2 class="menu3">비빔밥</h2>
    <!-- div.A = class "A" 를 가진 div 태그 생성  -->
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <!-- 아이디 선택자  -->
    <span id="title">오늘의 메뉴</span>
    <p id="title2"> 오늘의 할일</p>
    <!-- hn#A = id "A" 를 가진 hn 태그 생성 -->
    <h3 id="subtitle" class="subtitle subtitle2"> </h3>
    <!-- 여러 선택자 한번에 선택 -->
    <h4> 메뉴 </h4>
    <p class="desc"> Lorem ipsum dolor sit amet. </p>
        <span class="smalltitle"> 안녕하세요 </span>
</body>
</html>
